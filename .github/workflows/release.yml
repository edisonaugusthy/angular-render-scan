name: Release

on:
  workflow_dispatch:

jobs:
  release:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    permissions:
      contents: write
      id-token: write

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version: 24
          registry-url: 'https://registry.npmjs.org'
          package-manager-cache: false

      - name: Install dependencies
        run: npm ci

      - name: Build
        run: npm run build

      - name: Read package version
        id: package
        run: |
          VERSION=$(node -p "require('./packages/angular-render-scan/package.json').version")
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"

      - name: Verify package availability
        run: |
          npm config get registry
          if npm view angular-render-scan@${{ steps.package.outputs.version }} version >/dev/null 2>&1; then
            echo "angular-render-scan@${{ steps.package.outputs.version }} already exists on npm."
            exit 1
          fi

      - name: Publish to NPM
        run: |
          if [ -n "${NODE_AUTH_TOKEN:-}" ]; then
            npm whoami
          else
            echo "NPM_TOKEN is not set; npm publish will use trusted publishing/OIDC if it is configured for this package."
          fi
          npm publish --access public --provenance
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
        working-directory: packages/angular-render-scan

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v${{ steps.package.outputs.version }}
          target_commitish: main
          generate_release_notes: true
